set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set-option -g set-clipboard external

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @tpm_plugins '
        tmux-plugins/tpm
        tmux-plugins/tmux-sensible
        christoomey/vim-tmux-navigator
        tmux-plugins/tmux-yank
        tmux-plugins/tmux-cpu
        tmux-plugins/tmux-battery
'

# Status bar: Gruvbox Material, colours taken from .config/alacritty/themes/gruvbox_material.toml
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 120
set -g status-style "bg=#3c3836,fg=#dfbf8e"

# session name, amber while the prefix is held
set -g status-left "#[fg=#282828,bg=#a9b665,bold] #{?client_prefix,#[bg=#e3a84e],}#S #[default]"

# segments: net rate (./net_speed.sh: default-route interface, sampled live) | ram | date+time | battery
set -g @ram_percentage_format "%2.0f%%"
# tmux-battery's built-in tier icons are a block bar (█▇▆▅▄▃▂▁), which reads as a plain
# square in the bar; use Material Design battery glyphs from JetBrainsMono Nerd Font instead.
set -g @batt_icon_charge_tier8 "󰁹"
set -g @batt_icon_charge_tier7 "󰂂"
set -g @batt_icon_charge_tier6 "󰂀"
set -g @batt_icon_charge_tier5 "󰁾"
set -g @batt_icon_charge_tier4 "󰁽"
set -g @batt_icon_charge_tier3 "󰁻"
set -g @batt_icon_charge_tier2 "󰁺"
set -g @batt_icon_charge_tier1 "󰂎"
set -g status-right "#[fg=#282828,bg=#7daea3] #(exec $HOME/.config/tmux/net_speed.sh) #[fg=#282828,bg=#89b482] RAM #{ram_percentage} #[fg=#dfbf8e,bg=#504945] %F %R #[fg=#282828,bg=#d3869b] #{battery_icon_charge} #{battery_percentage} #[default]"

# padded on both sides; the separator is dropped because tmux draws it after a
# #[default] reset, which would leave a terminal-background slice between windows
set -g window-status-format "#[fg=#dfbf8e,bg=#3c3836] #I #W "
set -g window-status-current-format "#[fg=#dfbf8e,bg=#504945] #I #W "
set -g window-status-separator ""
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d3869b"
set -g message-style "bg=#3c3836,fg=#dfbf8e"
set -g mode-style "bg=#504945,fg=#dfbf8e"
set -g clock-mode-colour "#a9b665"

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set -g allow-passthrough all
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

run -b '~/.tmux/plugins/tpm/tpm'
